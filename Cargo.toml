# muguet - Cargo.toml
# Constantin Clerc (c22dev) - 0.1

[package]
name = "muguet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib_router.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
wasmtime = { version = "49", optional = true, default-features = false, features = ["runtime", "threads", "profiling", "anyhow"] }
anyhow = "1"
serde_json = "1.0.151"
wgpu = "30.0.1"
pollster = "1.0.1"
regex = "1.13.1"
winit = "0.30.13"
cpal = "0.18.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# WebSocket client for the Grand-V relay. default-features = false keeps tokio out
# of a game build that has no async runtime; the blocking API needs none.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
libc = "0.2"
bcdec_rs = "0.2"
wasmparser = { version = "0.258.3", optional = true }
wasm-encoder = { version = "0.258.3", optional = true, features = ["wasmparser"] }

[dev-dependencies]
# Exercise WebGPU texture-copy validation in Actions without physical GPU hardware.
wgpu = { version = "30.0.1", features = ["noop"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerAxisInput", "GCControllerButtonInput", "GCControllerDirectionPad"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
jni = "0.21"

[features]
default = ["jit"]
# Compile the Vulkan renderer and launcher helpers without the Wasmtime runtime.
native-renderer = []
jit = ["dep:wasmtime", "wasmtime/cranelift", "wasmtime/parallel-compilation", "dep:wasmparser", "dep:wasm-encoder"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[patch.crates-io]
wgpu-core = { path = "vendor/wgpu-core" }
