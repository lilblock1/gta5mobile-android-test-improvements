plugins { id 'com.android.application' }

android {
    namespace 'dev.muguet'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        // Keep the test launcher independent from the original dev.muguet app.
        // Android uses applicationId (not namespace) to decide app identity/data storage.
        applicationId 'dev.muguet.test'
        minSdk 29
        targetSdk 36
        versionCode 7
        versionName '0.1.6-nightlane-worldstream-phase1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = project.hasProperty('withDriverProxy') && project.property('withDriverProxy').toString().toBoolean() } }
    // CI hands over the keystore through ANDROID_KEYSTORE_PATH so every published
    // APK carries one signature and installs over the previous one. Without the
    // secret (any local build) Gradle keeps using its own debug keystore.
    def ciKeystore = System.getenv('ANDROID_KEYSTORE_PATH')
    if (ciKeystore) {
        signingConfigs {
            ci {
                storeFile file(ciKeystore)
                // ponytail: the Android SDK's published default debug credentials;
                // move them into secrets before this signs a release build.
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        buildTypes { debug { signingConfig signingConfigs.ci } }
    }
    // The vendored GTA V engine core (libgta5engine.so) is built by CMake, but only
    // when the generated wasm2c game code is present. Until then the app still
    // ships just libmuguet.so (the Rust/wasmtime path), so the existing build and
    // CI stay green. Flip -PwithEngineCore=true (or set withEngineCore=true) after
    // running app/Scripts/prepare_android.py to build and package the engine too.
    if (project.hasProperty('withEngineCore') && project.property('withEngineCore').toString().toBoolean()) {
        externalNativeBuild {
            cmake {
                path 'CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

// Only the native library is included; users import their own game data.
tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir.parentFile
    def nativeApi = android.defaultConfig.minSdkVersion.apiLevel
    def ndkDir = new File(android.sdkDirectory, "ndk/${android.ndkVersion}").absolutePath
    environment 'ANDROID_NDK_HOME', ndkDir
    environment 'ANDROID_NDK_ROOT', ndkDir
    // Native linking targets minSdk, not compileSdk/targetSdk. NDK r28 supports up to API 35.
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '--platform', nativeApi.toString(),
        '-o', 'android/app/src/main/jniLibs', 'build', '--release', '--lib'
    doFirst {
        def platformsFile = new File(ndkDir, 'meta/platforms.json')
        if (!platformsFile.isFile()) {
            throw new GradleException("Missing NDK ${android.ndkVersion}. Install it with the Android SDK Manager.")
        }
        def platforms = new groovy.json.JsonSlurper().parse(platformsFile)
        if (nativeApi < platforms.min || nativeApi > platforms.max) {
            throw new GradleException("Native API ${nativeApi} is outside NDK ${android.ndkVersion}'s supported range ${platforms.min}-${platforms.max}.")
        }
    }
    inputs.property('nativeApi', nativeApi)
    inputs.property('ndkVersion', android.ndkVersion)
    inputs.files(fileTree('../../src'), file('../../Cargo.toml'), file('../../Cargo.lock'), file('../../build.rs'), fileTree('../../vendor'))
    outputs.file('src/main/jniLibs/arm64-v8a/libmuguet.so')
}
tasks.named('preBuild').configure { dependsOn 'buildRust' }

// Experimental native Vulkan proxy is opt-in: -PwithDriverProxy=true.
// The proxy is built independently of the generated wasm2c engine.
if (project.hasProperty('withDriverProxy') && project.property('withDriverProxy').toString().toBoolean()) {
    def ndkDir = new File(android.sdkDirectory, "ndk/${android.ndkVersion}")
    def proxyBuildDir = file("${buildDir}/driver-proxy")
    tasks.register('configureDriverProxy', Exec) {
        commandLine 'cmake', '-S', file('../driver-proxy').absolutePath,
            '-B', proxyBuildDir.absolutePath,
            '-DCMAKE_TOOLCHAIN_FILE=' + new File(ndkDir, 'build/cmake/android.toolchain.cmake').absolutePath,
            '-DANDROID_ABI=arm64-v8a', '-DANDROID_PLATFORM=android-29',
            '-DCMAKE_BUILD_TYPE=Release'
    }
    tasks.register('compileDriverProxy', Exec) {
        dependsOn 'configureDriverProxy'
        commandLine 'cmake', '--build', proxyBuildDir.absolutePath, '--parallel', '4'
    }
    tasks.register('packageDriverProxy', Copy) {
        dependsOn 'compileDriverProxy'
        from(fileTree(proxyBuildDir) { include '**/libvulkan.so', '**/libmain_hook.so', '**/libhook_impl.so' })
        // CMake places hook libraries under nested _deps/... directories.
        // Flatten only these three known filenames into Android's ABI folder.
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
        duplicatesStrategy = DuplicatesStrategy.FAIL
        into file('src/main/jniLibs/arm64-v8a')
        doLast {
            ['libvulkan.so', 'libmain_hook.so', 'libhook_impl.so'].each { name ->
                if (!new File(destinationDir, name).isFile())
                    throw new GradleException("Driver proxy dependency missing: " + name)
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn 'packageDriverProxy' }
}
