name: Nightlane native ARM64 only (wasm2c + Vulkan renderer)

# Builds an experimental native-only APK; old Wasmtime code is preserved in Git.
# A successful APK build does not prove native gameplay.
on:
  push:
    branches: [experimental/native-arm64-dual-runtime, fix/native-futex-startup-diagnostics, experimental/native-only-renderer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightlane-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-candidate:
    name: Compile native-only ARM64 APK (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 295
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      ENGINE_ZIP: /tmp/nightlane-engine-resources.zip
      NATIVE_MIRROR: /tmp/nightlane-native-mirror
    steps:
      - uses: actions/checkout@v5

      - name: Check native backend source gates and current bundle
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/engine_resources.py prepare --output "$ENGINE_ZIP"

      - name: Stage hash-verified game module for local wasm2c generation
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          expected = "11ca8d2c04c5e843d18ff4aea4899d72c86973c6b031df334e67c446b2ae83e0"
          member = "assets/b/8b0b5899ed/game.wasm"
          dest = pathlib.Path(os.environ["NATIVE_MIRROR"]) / "b/8b0b5899ed/game.wasm"
          dest.parent.mkdir(parents=True, exist_ok=True)
          sha = hashlib.sha256()
          with zipfile.ZipFile(os.environ["ENGINE_ZIP"]) as archive:
              with archive.open(member) as src, dest.open("wb") as dst:
                  while data := src.read(1 << 20):
                      sha.update(data)
                      dst.write(data)
          if sha.hexdigest() != expected:
              dest.unlink(missing_ok=True)
              raise SystemExit("Native engine staging failed: game.wasm SHA-256 mismatch")
          print("[native-engine] verified game.wasm SHA256", expected)
          PY

      - name: Install host wasm2c toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build ccache unzip pkg-config libasound2-dev

      # Each new run saves a fresh cache key; prefix restore reuses the latest
      # snapshot after successful cache saves. Job cancellation can prevent cache upload.
      # ccache still checks the exact compiler, flags, headers and source code.
      - name: Restore compiled native C objects
        id: native_c_cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nightlane-native-ccache
          key: native-arm64-ndk28-wasm8b0-v1-${{ hashFiles('android/app/CMakeLists.txt', 'vendor/fivestar/**', 'app/Scripts/**') }}-${{ github.run_id }}
          restore-keys: |
            native-arm64-ndk28-wasm8b0-v1-${{ hashFiles('android/app/CMakeLists.txt', 'vendor/fivestar/**', 'app/Scripts/**') }}-
            native-arm64-ndk28-wasm8b0-v1-

      - name: Configure safe native compiler cache
        run: |
          echo "NIGHTLANE_NATIVE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=/tmp/nightlane-native-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p /tmp/nightlane-native-ccache
          CCACHE_DIR=/tmp/nightlane-native-ccache ccache --zero-stats
          echo "[nightlane-native] ccache configured for NDK Clang. Baseline is cold unless restored."

      - name: Generate native ARM64 game C with pinned, strict patchers
        run: |
          python3 app/Scripts/prepare_android.py --mirror "$NATIVE_MIRROR" --allow-bundled-engine
          # Unimplemented imports must be resolved before claiming native boot.
          python3 - <<'PY'
          from pathlib import Path
          report = Path("app/Build/import-status.tsv")
          if not report.is_file():
              raise SystemExit("Missing native import resolution report")
          lines = report.read_text().splitlines()
          bad = [x for x in lines if "\tunported:" in x]
          print(f"[native-engine] total_imports={len(lines)} unported={len(bad)}")
          for issue in bad[:40]:
              print("::error::Unimplemented native engine import: " + issue)
          if bad:
              raise SystemExit("Native host import coverage incomplete; no false-ready APK")
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-arm64-candidate
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Set up Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Restore repeatable APK signing if configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/native-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/native-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret: Gradle uses a temporary debug certificate. Back up saves before replacing an installed test app."
          fi

      - name: Build native ARM64 core and Vulkan renderer without Wasmtime
        timeout-minutes: 235
        run: >-
          gradle -p android testDebugUnitTest assembleDebug
          -PwithEngineCore=true
          -PnativeRendererOnly=true
          "-PengineResourcesZip=$ENGINE_ZIP"
          --no-daemon --max-workers=2 --stacktrace

      - name: Confirm optimized Clang options were used for native ARM64 game code
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          ninja = list(pathlib.Path("android/app/.cxx").rglob("build.ninja"))
          if not ninja:
              raise SystemExit("Could not inspect actual Android NDK compile flags")
          commands = subprocess.check_output(["ninja", "-C", str(ninja[0].parent), "-t", "commands"], text=True)
          host = next((line for line in commands.splitlines() if "EngineBridge.c" in line), None)
          generated = next((line for line in commands.splitlines()
                            if re.search(r"game_[^/ ]+\\.c", line)), None)
          if not host or not generated:
              raise SystemExit("Missing native C compile commands")
          def last_opt(line):
              flags = re.findall(r"(?<!\\S)-O([0-3sgz]|fast)(?!\\S)", line)
              return flags[-1] if flags else None
          print("Handwritten host last -O:", last_opt(host),
                "wasm2c generated game last -O:", last_opt(generated))
          if last_opt(host) != "2" or last_opt(generated) != "1":
              raise SystemExit("Compiled engine was not optimized as requested")
          PY

      - name: Validate native engine and Vulkan renderer were actually packaged
        run: |
          python3 tools/engine_resources.py verify-apk --native-only --apk android/app/build/outputs/apk/debug/app-debug.apk --resources "$ENGINE_ZIP"
          python3 - <<'PY'
          import zipfile
          path = "android/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              required = {"lib/arm64-v8a/libmuguet.so", "lib/arm64-v8a/libgta5engine.so"}
              missing = required - names
              if missing:
                  raise SystemExit(f"Native candidate APK incomplete: {sorted(missing)}")
              print("[native-engine] wasm2c core and renderer-only Vulkan library are present")
          PY

      - name: Publish experimental native-only debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Nightlane-ARM64-NATIVE-ONLY-OPTIMIZED-0.2.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        run: |
          echo '### Native ARM64 experiment' >> "$GITHUB_STEP_SUMMARY"
          echo 'Optimized ARM64 wasm2c core, Vulkan renderer, native launcher settings, shaders-only assets; Wasmtime runtime excluded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native wasm2c is NOT proven playable until device tests pass. Back up game saves first.' >> "$GITHUB_STEP_SUMMARY"

      # Save even after compilation/link failure: partial Clang object output
      # from a long-running build is still useful and validated by ccache.
      - name: Native compiler cache statistics
        if: always() && steps.native_c_cache.outcome == 'success'
        run: |
          CCACHE_DIR=/tmp/nightlane-native-ccache ccache --show-stats || true
          du -sh /tmp/nightlane-native-ccache || true

      - name: Persist compiled native C objects for next run
        if: always() && steps.native_c_cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /tmp/nightlane-native-ccache
          key: ${{ steps.native_c_cache.outputs.cache-primary-key }}
