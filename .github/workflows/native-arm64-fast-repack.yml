name: Nightlane archived fast repack (incompatible engine ABI)

# This older path reused the unoptimized 0.1.13 engine. Native 0.2.0 now
# registers nativeConfigure() in libgta5engine.so. An older library would fail
# RegisterNatives and make Play unusable. Keep this workflow as an explicit,
# safe failure; use native-arm64-experiment.yml for an up-to-date native build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obsolete-fast-repack:
    name: Retired — requires new native engine ABI
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::The old cached native engine cannot run the 0.2.0 launcher. Build native-arm64-experiment.yml instead."
          exit 1
